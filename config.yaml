bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

max_text: 100000
max_images: 5
max_messages: 25

use_plain_responses: false
allow_dms: true

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []
  roles:
    allowed_ids: []
    blocked_ids: []
  channels:
    allowed_ids: []
    blocked_ids: []

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

models:
  openrouter/openrouter/free:

system_prompt: |
  You are a helpful Discord chatbot. Answer clearly and concisely.
